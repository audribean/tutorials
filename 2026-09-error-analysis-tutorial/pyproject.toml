[project]
name = "error-analysis-tutorial"
version = "0.1.0"
description = "Environment for running error_analysis_tutorial.ipynb"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyannote.core>=5.0",
    "pyannote.database>=5.0",
    # Uses pyannote.metrics.errors.{category_metrics,category_plots,
    # temporal_metrics,temporal_plots}, added in
    # https://github.com/pyannote/pyannote-metrics/pull/89
    "pyannote.metrics",
    "matplotlib>=3.7",
    "pandas>=2.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
]

[tool.uv.sources]
"pyannote.metrics" = { git = "https://github.com/pyannote/pyannote-metrics", rev = "refs/pull/89/head" }