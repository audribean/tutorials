[project]
name = "error-analysis-tutorial"
version = "0.1.0"
description = "Environment for running error_analysis_tutorial.ipynb"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyannote.core>=5.0",
    "pyannote.database>=5.0",
    # Uses pyannote.metrics.errors.{category_metrics,category_plots,
    # temporal_metrics,temporal_plots}. Pinned as a lower bound only, since
    # that submodule isn't in the current 4.1 PyPI release yet -- assumed
    # to ship in a subsequent release.
    "pyannote.metrics>=4.1",
    "matplotlib>=3.7",
    "pandas>=2.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
]
